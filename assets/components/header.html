<header id="header" class="site-header">
  <div class="wrap header-inner">

    <!-- Checkbox nascosto per il toggle -->
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">

    <!-- Bottone menu (vale sia desktop che mobile) -->
    <label for="nav-toggle" class="menu-btn" aria-label="Apri menu">
      <span class="menu-icon">☰</span>
      <span class="menu-text">Menu</span>
    </label>

    <!-- Dropdown -->
    <nav class="main-nav" id="main-nav" role="navigation" aria-label="Menu principale">
      <ul id="main-nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalogo.html">Catalogo</a></li>
        <li><a href="quiz.html">33Quiz</a></li>

        <!-- ✅ Collaborazioni con sub-menu -->
        <li class="has-dropdown" id="collab-item">
          <div class="nav-row">
            <a class="nav-link" href="collaborazioni.html">Collaborazioni</a>

            <!-- ✅ Freccetta cliccabile (serve per MOBILE) -->
            <button
              type="button"
              class="dropdown-toggle"
              aria-label="Apri sottomenù Collaborazioni"
              aria-expanded="false"
              aria-controls="collab-submenu"
            >
              <span class="chev">›</span>
            </button>
          </div>

          <!-- ✅ Submenu: compare SOLO in hover (desktop) o click freccetta (mobile) -->
          <ul class="dropdown-menu" id="collab-submenu" role="menu" aria-label="Sottomenù Collaborazioni">
            <li><a href="collaborazioni.html">Iris Shero</a></li>
          </ul>
        </li>

        <li><a href="chi_siamo.html">Chi Siamo</a></li>
      </ul>
    </nav>

    <!-- LOGO -->
    <a class="logo" href="index.html" aria-label="33giri logo">
      <img
        src="logo 33 GIRI studiowhite  copia.png"
        alt="33GIRI Italian Design Studio"
        class="logo-img"
      />
    </a>

    <div class="header-actions">
      <a class="icon-btn" aria-label="Account" href="account.html" role="button">👤</a>
    </div>
  </div>

  <style>
    /* ===== BASE ===== */
    .site-header{
      position: relative;
      z-index: 100;
      background: #ffffff;
      overflow: visible;
    }

    .wrap.header-inner{
      display:flex;
      align-items:center;
      gap:16px;
      position: relative;
      overflow: visible;
    }

    .nav-toggle{ display:none; }

    /* ===== BOTTONE MENU ===== */
    .menu-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      user-select:none;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(44,36,22,0.18);
      background: rgba(255,255,255,0.92);
      box-shadow: 0 10px 24px rgba(0,0,0,0.06);
      color:#2c2416;
      font-weight:600;
      letter-spacing:0.2px;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .menu-btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(0,0,0,0.08);
      background: #ffffff;
    }

    .menu-icon{ font-size:18px; line-height:1; }
    .menu-text{ font-size:14px; }

    /* ===== LOGO ===== */
    .logo{
      flex: 1;
      display:flex;
      justify-content:center;
      align-items:center;
      text-decoration:none;
      min-width: 0;
    }

    .logo-img{
      height: 145px;
      width: auto;
      display:block;
      object-fit: contain;
    }

    /* ===== MENU PRINCIPALE (dropdown) ===== */
    .main-nav{
      position:absolute;
      top: calc(100% + 10px);
      left: 0;

      width: 260px;
      background:#ffffff;
      border:1px solid rgba(44,36,22,0.14);
      border-radius:14px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.10);
      overflow: visible;

      opacity:0;
      transform: translateY(-6px);
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 2100;
    }

    .main-nav ul{
      list-style:none;
      margin:0;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:6px;
      overflow: visible;
    }

    .main-nav a{
      display:block;
      padding:10px 12px;
      border-radius:10px;
      text-decoration:none;
      color:#2c2416;
      font-weight:600;
      transition: background .15s ease, transform .15s ease;
    }

    .main-nav a:hover,
    .main-nav a:focus{
      background: rgba(44,36,22,0.06);
      transform: translateX(2px);
      outline:none;
    }

    /* Toggle menu principale */
    .nav-toggle:checked + .menu-btn + .main-nav{
      opacity:1;
      transform: translateY(0);
      pointer-events:auto;
    }

    /* ===== riga Collaborazioni + freccetta ===== */
    .has-dropdown{ position: relative; }
    .nav-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .nav-link{
      flex:1;
      min-width:0;
    }

    .dropdown-toggle{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }
    .dropdown-toggle:hover{
      background: rgba(44,36,22,0.06);
      transform: translateX(1px);
    }
    .dropdown-toggle .chev{
      font-size: 18px;
      opacity: .65;
      line-height: 1;
    }

    /* ===== SUBMENU (Iris Shero) - DI DEFAULT NASCOSTO OVUNQUE ===== */
    .dropdown-menu{
      display:none;
      list-style:none;
      margin:0;
      padding:10px 0;
      background:#fff;
      border-radius:10px;
      box-shadow: 0 6px 26px rgba(0,0,0,0.14);
      min-width:210px;
      z-index: 3000;
      overflow: visible;
    }

    .dropdown-menu a{
      display:block;
      padding:11px 18px;
      color:#2c2416;
      font-size:13px;
      text-decoration:none;
      transition: background 0.2s ease, transform 0.15s ease;
      white-space: nowrap;
    }
    .dropdown-menu a:hover{
      background:#f7f6f2;
      color: #5a7fa0;
      transform: translateX(2px);
    }

    /* =========================
       DESKTOP: flyout A DESTRA solo in HOVER
       ========================= */
    @media (min-width: 769px){
      .dropdown-menu{
        position:absolute;
        top: 50%;
        left: 100%;
        transform: translateY(-50%);
        margin-left: 12px;
      }

      /* ✅ appare solo passando su Collaborazioni (anche sulla freccetta) */
      .has-dropdown:hover > .dropdown-menu{
        display:block;
      }
    }

    /* =========================
       MOBILE: submenu sotto, SOLO se clicchi la freccetta
       ========================= */
    @media (max-width: 768px){
      #header{ position: relative; z-index: 2000; overflow: visible; }
      .wrap.header-inner{ gap:12px; }
      .menu-btn{ padding:10px 12px; }
      .menu-text{ display:none; }

      .main-nav{
        left: 0;
        right: 0;
        width: auto;
        border-bottom-left-radius: 14px;
        border-bottom-right-radius: 14px;
      }

      .logo-img{ height: 115px; }

      .dropdown-menu{
        position: static;
        transform: none;
        margin-left: 0;
        margin-top: 6px;
        box-shadow: none;
        border: 1px solid rgba(44,36,22,0.10);
        border-radius: 12px;
        padding: 6px 0;
        background: #fff;
      }

      /* ✅ SOLO quando metto la classe "is-open" (via JS) */
      .has-dropdown.is-open > .dropdown-menu{
        display:block;
      }
    }
  </style>

  <script>
    (function () {
      const toggle = document.getElementById('nav-toggle');
      const nav = document.getElementById('main-nav');
      const btn = document.querySelector('label[for="nav-toggle"]');

      const collabItem = document.getElementById('collab-item');
      const collabBtn = collabItem ? collabItem.querySelector('.dropdown-toggle') : null;
      const submenu = document.getElementById('collab-submenu');

      function closeSubmenu() {
        if (!collabItem) return;
        collabItem.classList.remove('is-open');
        if (collabBtn) collabBtn.setAttribute('aria-expanded', 'false');
      }

      function toggleSubmenu() {
        if (!collabItem) return;
        const isOpen = collabItem.classList.toggle('is-open');
        if (collabBtn) collabBtn.setAttribute('aria-expanded', String(isOpen));
      }

      // ✅ MOBILE: apri/chiudi SOLO cliccando la freccetta
      if (collabBtn) {
        collabBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          toggleSubmenu();
        });
      }

      // chiudi submenu quando clicchi un link del submenu
      if (submenu) {
        submenu.addEventListener('click', (e) => {
          if (e.target.tagName === 'A') {
            closeSubmenu();
            toggle.checked = false; // chiude anche il menu principale
          }
        });
      }

      // chiudi menu principale quando clicchi un link normale
      nav.addEventListener('click', (e) => {
        if (e.target.tagName === 'A') {
          // se clicchi "Collaborazioni" (link), lasciamo navigare e chiudiamo tutto
          closeSubmenu();
          toggle.checked = false;
        }
      });

      // chiudi quando clicchi fuori
      document.addEventListener('click', (e) => {
        const clickedInside = nav.contains(e.target) || btn.contains(e.target);
        if (!clickedInside) {
          toggle.checked = false;
          closeSubmenu();
        }
      });

      // chiudi con ESC
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          toggle.checked = false;
          closeSubmenu();
        }
      });

      // quando chiudi il menu principale, chiudi anche il submenu
      toggle.addEventListener('change', () => {
        if (!toggle.checked) closeSubmenu();
      });

      // su resize da mobile->desktop, resetto stato mobile
      window.addEventListener('resize', () => {
        closeSubmenu();
      });
    })();
  </script>
</header>
