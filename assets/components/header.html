<header id="header" class="site-header">
  <div class="wrap header-inner">

    <!-- Checkbox nascosto per il toggle -->
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">

    <!-- Bottone menu (vale sia desktop che mobile) -->
    <label for="nav-toggle" class="menu-btn" aria-label="Apri menu">
      <span class="menu-icon">☰</span>
      <span class="menu-text">Menu</span>
    </label>

    <!-- Dropdown -->
    <nav class="main-nav" id="main-nav" role="navigation">
      <ul id="main-nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalogo.html">Catalogo</a></li>
        <li><a href="quiz.html">33Quiz</a></li>
        <li><a href="collaborazioni.html">Collaborazioni</a></li>
        <li><a href="corporate.html">Idea regalo</a></li>
        <li><a href="chi_siamo.html">Chi Siamo</a></li>
      </ul>
    </nav>

    <!-- LOGO (nuovo) -->
    <a class="logo" href="index.html" aria-label="33giri logo">
      <img
        src="assets/logo/33giri-studiowhite.jpeg"
        alt="33GIRI Italian Design Studio"
        class="logo-img"
      />
    </a>

    <div class="header-actions">
      <a class="icon-btn" aria-label="Account" href="account.html" role="button">👤</a>
    </div>
  </div>

  <style>
    /* ===== BASE ===== */
    .site-header{
      position: relative;
      z-index: 100;
      background: #ffffff;
    }

    .wrap.header-inner{
      display:flex;
      align-items:center;
      gap:16px;
      position: relative;
    }

    .nav-toggle{ display:none; }

    /* ===== BOTTONE MENU (desktop + mobile) ===== */
    .menu-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      user-select:none;

      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(44,36,22,0.18);
      background: rgba(255,255,255,0.92);
      box-shadow: 0 10px 24px rgba(0,0,0,0.06);

      color:#2c2416;
      font-weight:600;
      letter-spacing:0.2px;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .menu-btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(0,0,0,0.08);
      background: #ffffff;
    }

    .menu-icon{ font-size:18px; line-height:1; }
    .menu-text{ font-size:14px; }

    /* ===== LOGO (centrato davvero) ===== */
    .logo{
      flex: 1;
      display:flex;
      justify-content:center;
      align-items:center;
      text-decoration:none;
      min-width: 0;
    }

    .logo-img{
      height: 145px;           /* <-- INGRANDITO (prima 120) */
      width: auto;
      display:block;
      object-fit: contain;
    }

    /* ===== DROPDOWN (desktop default) ===== */
    .main-nav{
      position:absolute;
      top: calc(100% + 10px);
      left: 0;

      width: 260px;
      background:#ffffff;
      border:1px solid rgba(44,36,22,0.14);
      border-radius:14px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.10);
      overflow:hidden;

      opacity:0;
      transform: translateY(-6px);
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 2100;
    }

    .main-nav ul{
      list-style:none;
      margin:0;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .main-nav a{
      display:block;
      padding:10px 12px;
      border-radius:10px;
      text-decoration:none;
      color:#2c2416;
      font-weight:600;
      transition: background .15s ease, transform .15s ease;
    }

    .main-nav a:hover,
    .main-nav a:focus{
      background: rgba(44,36,22,0.06);
      transform: translateX(2px);
      outline:none;
    }

    /* Toggle dropdown */
    .nav-toggle:checked + .menu-btn + .main-nav{
      opacity:1;
      transform: translateY(0);
      pointer-events:auto;
    }

    /* header actions */
    .header-actions{
      display:flex;
      align-items:center;
      gap:18px;
      margin-left: 0;
    }

    /* ===== MOBILE: dropdown full-width + logo un po’ più piccolo ===== */
    @media (max-width: 768px){
      #header{
        position: relative;
        z-index: 2000;
        overflow: visible;
      }

      .wrap.header-inner{
        gap:12px;
      }

      .menu-btn{
        padding:10px 12px;
      }

      .menu-text{ display:none; }

      .main-nav{
        left: 0;
        right: 0;
        width: auto;
        border-bottom-left-radius: 14px;
        border-bottom-right-radius: 14px;
      }

      .logo-img{
        height: 115px;         /* <-- mobile */
      }
    }
  </style>

  <script>
    // Chiude il menu quando clicchi su un link o fuori dal menu
    (function () {
      const toggle = document.getElementById('nav-toggle');
      const nav = document.getElementById('main-nav');
      const btn = document.querySelector('label[for="nav-toggle"]');

      // chiudi quando clicchi un link
      nav.addEventListener('click', (e) => {
        if (e.target.tagName === 'A') toggle.checked = false;
      });

      // chiudi quando clicchi fuori
      document.addEventListener('click', (e) => {
        const clickedInside = nav.contains(e.target) || btn.contains(e.target);
        if (!clickedInside) toggle.checked = false;
      });

      // chiudi con ESC
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') toggle.checked = false;
      });
    })();
  </script>
</header>
